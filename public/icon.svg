      <stop stop-color="#0d9488" offset="0"/>
      <stop stop-color="#0a5f5a" offset="0.6"/>
      <stop stop-color="#053330" offset="1"/>
    </linearGradient>
    <linearGradient id="shine" x1="80" y1="60" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.5"/>
      <stop stop-color="#ffffff" stop-opacity="0" offset="0.5"/>
