<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Humas Eksyar — Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        font-family: ui-sans-serif, -apple-system, "Inter Tight", system-ui, sans-serif;
        color: #14201a;
        background: #f7f8f6;
      }
      @media (prefers-color-scheme: dark) {
        html, body { color: #f8f1dd; background: #0a1410; }
      }
      .wrap {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background-image:
          radial-gradient(at 18% 22%, rgba(13,148,136,0.25) 0%, transparent 50%),
          radial-gradient(at 80% 80%, rgba(232,148,34,0.18) 0%, transparent 50%);
      }
      .card {
        max-width: 480px;
        text-align: center;
        background: rgba(255,255,255,0.55);
        border: 1px solid rgba(255,255,255,0.4);
        border-radius: 1.6rem;
        padding: 2.4rem;
        backdrop-filter: blur(20px) saturate(180%);
        box-shadow: 0 24px 48px -16px rgba(13,148,136,0.18);
      }
      @media (prefers-color-scheme: dark) {
        .card { background: rgba(20,32,26,0.55); border-color: rgba(255,255,255,0.10); }
      }
      h1 {
        font-size: 1.8rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
      }
      p {
        opacity: 0.8;
        line-height: 1.55;
        margin: 0.5rem 0 1.5rem;
      }
      a {
        color: #0d9488;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { color: #0a5f5a; }
      .logo {
        width: 56px;
        height: 56px;
        display: block;
        margin: 0 auto 1rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <img class="logo" src="/icon.svg" alt="Humas Eksyar" />
        <h1>Sedang offline.</h1>
        <p>
          Belum ada koneksi. Tenang — beberapa halaman sudah pernah kamu kunjungi
          tetap bisa dibuka dari cache. Coba kembali setelah jaringan tersambung.
        </p>
        <a href="/">Kembali ke beranda</a>
      </div>
    </div>
  </body>
</html>
