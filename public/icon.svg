  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#shine)" opacity="0.6"/>
  <!-- Octagon ornament behind ES -->
